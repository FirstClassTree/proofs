<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShapelessAI Employees</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@15/lib/marked.umd.js"></script>
<style>
:root{--bg:#f4f5f7;--rail:#fff;--card:#fff;--ink:#101828;--mute:#667085;--faint:#98a2b3;--line:#e4e7ec;--soft:#f2f4f7;--top:#121a2d;--topink:#e8ecf5;--topmute:#8f9bb8;--you:#2f5bea;--pa:#7c3aed;--cos:#0e9f6e;--red:#d92d20;--amber:#dc6803;--green:#079455;--new:#fef0c7;--sel:#eef2ff;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
 --a-pages:#2f5bea;--a-studio:#6938ef;--a-extension:#9e77ed;--a-API:#0e9aa7;--a-CLI:#0b7285;--a-money:#d92d20;--a-data:#e04f16;--a-server:#17b26a;--a-engine:#079455;--a-prompts:#dd2590;--a-tooling:#667085;--a-config:#98a2b3;--a-docs:#d0d5dd;--a-tests:#a6ef67;--a-other:#e4e7ec}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0e14;--rail:#10141c;--card:#141922;--ink:#eaecf0;--mute:#98a2b3;--faint:#667085;--line:#232a36;--soft:#1b212c;--top:#0a0d14;--new:#3d2f0a;--sel:#1a2340;--shadow:none}}
:root[data-theme="dark"]{--bg:#0b0e14;--rail:#10141c;--card:#141922;--ink:#eaecf0;--mute:#98a2b3;--faint:#667085;--line:#232a36;--soft:#1b212c;--top:#0a0d14;--new:#3d2f0a;--sel:#1a2340;--shadow:none}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"tnum","cv11";display:flex;flex-direction:column;overflow-x:hidden}
a{color:var(--you);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.01em}
/* top bar: one line, never wraps; the people chips shrink before the brand does */
.top{display:flex;align-items:center;gap:14px;padding:0 16px;height:52px;background:var(--top);color:var(--topink);flex-wrap:nowrap;overflow:hidden}
.top .brand{flex:none;font-weight:700;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.top .brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#2f5bea,#7c3aed);display:inline-block;flex:none}
.top .brand small{font-weight:500;color:var(--topmute)}
.top .meta{color:var(--topmute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
.top .meta b{color:#fcd34d;font-weight:500}
.top .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex:0 1 auto;min-width:0}
.person{display:flex;align-items:center;gap:7px;border-radius:9px;padding:4px 6px 4px 9px;background:rgba(255,255,255,.06);min-width:0}
.person .nm{font-weight:600;font-size:12.5px;white-space:nowrap;color:var(--topink)}
.person .st{font-size:11px;color:var(--topmute);white-space:nowrap}
.person.live .st{color:#4ade80}
.person .ib{border:0;background:rgba(255,255,255,.08);color:var(--topink);border-radius:6px;width:26px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.person .ib:hover{background:rgba(255,255,255,.18)}
.person .ib.ok{background:var(--green)}
@media (max-width:1280px){.top .meta{display:none}}
@media (max-width:1040px){.person .st{display:none}}
@media (max-width:700px){.person{padding:4px 4px}.person .nm{display:none}.top{gap:8px}.top .brand small{display:none}}
/* atoms */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;line-height:1;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--mute);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.red{background:#fee4e2;color:#b42318}.pill.amber{background:#fef0c7;color:#b54708}.pill.green{background:#dcfae6;color:#067647}.pill.blue{background:#e0eaff;color:#2f5bea}.pill.new{background:var(--new);color:#93370d}
.pill.solid.red{background:var(--red);color:#fff}.pill.solid.amber{background:var(--amber);color:#fff}.pill.solid.green{background:var(--green);color:#fff}.pill.solid.grey{background:var(--mute);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.red{background:#3b1210;color:#fda29b}:root:not([data-theme="light"]) .pill.amber{background:#3d2608;color:#fdb022}:root:not([data-theme="light"]) .pill.green{background:#0b2e1e;color:#75e0a7}:root:not([data-theme="light"]) .pill.blue{background:#172554;color:#a4bcfd}}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.pa{background:var(--pa)}.dot.cos{background:var(--cos)}.dot.you{background:var(--you)}.dot.red{background:var(--red)}.dot.amber{background:var(--amber)}.dot.green{background:var(--green)}.dot.grey{background:var(--faint)}.dot.blue{background:var(--you)}
.copy{border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:3px 9px;font:12px ui-monospace,Menlo,monospace;color:var(--ink);display:inline-flex;gap:7px;align-items:center;max-width:100%}
.copy span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy:hover{border-color:var(--you)}.copy.ok{border-color:var(--green);color:var(--green)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:500;display:inline-flex;gap:7px;align-items:center;white-space:nowrap;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--faint);text-decoration:none}
.btn.go{background:var(--you);color:#fff;border-color:var(--you)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn kbd{font:11px ui-monospace,Menlo,monospace;background:rgba(127,127,127,.2);border-radius:4px;padding:1px 5px}
/* text from records is clamped; a click opens it (Tal, 2026-10-11: "endless text ... would just be ignored") */
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;cursor:pointer;overflow-wrap:anywhere}
.clamp.one{-webkit-line-clamp:1}.clamp.two{-webkit-line-clamp:2}.clamp.six{-webkit-line-clamp:6}
.clamp.open{display:block;-webkit-line-clamp:unset}
/* dates: every screen opens with when it was opened, when it last moved, when it was done, and the
   deadline with how far it is (Tal, 2026-10-12: "no dates for when things were created ... decide by
   a specific date is also contextless") */
.when{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--mute);font-size:12.5px;margin:0 0 14px;align-items:center}
.when span b{color:var(--ink);font-weight:500}
.when .due{color:var(--red);font-weight:600}.when .due.far{color:var(--amber)}
.when .ok{color:var(--green)}
.cap{font-size:11px;color:var(--faint);white-space:nowrap}
/* layout */
.wrap{display:flex;flex:1;min-height:0}
.rail{width:320px;flex:none;border-right:1px solid var(--line);background:var(--rail);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.chips{display:flex;gap:6px;padding:12px 14px 6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:500}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group{padding:2px 0}
.group h2{font-size:12px;color:var(--ink);margin:0;padding:9px 16px 9px 14px;display:grid;grid-template-columns:10px 26px minmax(0,1fr) auto;gap:8px;align-items:center;cursor:pointer;user-select:none;font-weight:600}
.group h2:hover{background:var(--soft)}
.group h2 .n{color:var(--mute);font-weight:600;font-size:12px;text-align:right}
.group h2 .mini{display:flex;gap:4px;align-items:center;font-weight:500;font-size:11px;color:var(--mute);white-space:nowrap}
.group h2 .mini b{display:inline-flex;align-items:center;gap:3px;font-weight:600;color:var(--ink)}
.group h2::before{content:"▾";color:var(--faint);font-size:10px}
.group.closed h2::before{content:"▸"}
.group.closed .rows{display:none}
.group.sel h2{background:var(--sel)}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 16px 7px 14px;cursor:pointer;border-left:3px solid transparent}
.row:hover{background:var(--soft)}
.row.sel{background:var(--sel);border-left-color:var(--you)}
.row.lead{border-left-color:transparent;border-bottom:1px solid var(--line)}
.row .t{font-size:13.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .s{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .b{display:flex;gap:4px;align-items:center;flex:none}
.row.new .t::before{content:"new";font-size:10px;background:var(--new);color:#93370d;padding:1px 5px;border-radius:4px;margin-right:6px;vertical-align:1px;font-weight:600}
.sub-h{font-size:11px;color:var(--faint);padding:8px 16px 2px;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center;font-weight:600}
.sub-h i{width:8px;height:8px;border-radius:2px;display:inline-block}
.pane{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 30px 80px;min-width:0}
.pane h1{font-size:21px;margin:0 0 8px;line-height:1.3;overflow-wrap:anywhere}
.hdr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.sec{margin:0 0 18px}
.sec h3,.card h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:600}
.sec p{margin:4px 0;overflow-wrap:anywhere}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow)}
.card .rec{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card .why{color:var(--mute);font-size:13px;margin-top:10px}
.card .alts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0;overflow-wrap:anywhere}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:8px}
.shots a{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);aspect-ratio:4/3}
.shots img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.gaps li{color:var(--red)}
.spark{vertical-align:middle;flex:none}
.num{font-size:32px;font-weight:700;line-height:1;letter-spacing:-.02em}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:10px 0;display:flex}
.bar b{display:block;height:100%;background:var(--cos)}.bar b.red{background:var(--red)}.bar b.amber{background:var(--amber)}
.hist{list-style:none;padding:0;margin:0;font-size:13px}
.hist li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:4px 0;color:var(--mute)}
.hist li b{color:var(--ink);font-weight:500;overflow-wrap:anywhere}
input.in{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;background:var(--card);color:var(--ink)}
input.in:focus{outline:0;border-color:var(--you)}
.empty{color:var(--mute);padding:40px;text-align:center}
.err{background:#fee4e2;color:#b42318;border-radius:10px;padding:8px 12px;font-size:12.5px;margin:0 0 12px}
/* short cards side by side */
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 14px}
.trio .card{margin:0;padding:12px 14px;font-size:13px}
.trio .card h3{margin-bottom:6px}
/* why add, why not: the two sides of every PR, decision and ledger row (Tal, 2026-10-12) */
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:0 0 14px}
.side{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;border-top:3px solid var(--green);box-shadow:var(--shadow)}
.side.no{border-top-color:var(--red)}
.side h3{margin-bottom:6px}
.side .num2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
/* the path to live: who does what, in order */
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.step{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 7px;font-size:12.5px;background:var(--card)}
.step b{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:999px;background:var(--soft);color:var(--mute)}
.step b.you{background:#e0eaff;color:#2f5bea}.step b.done{background:#dcfae6;color:#067647}
.steps .arr{color:var(--faint)}
/* options with their for and against */
.opts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:0 0 14px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.opt.first{border-color:var(--you)}
.opt .fa{font-size:12.5px;display:grid;grid-template-columns:14px minmax(0,1fr);gap:4px 8px}
.opt .fa b{font-weight:700;font-family:ui-monospace,Menlo,monospace}
.opt .fa .p{color:var(--green)}.opt .fa .m{color:var(--red)}
.opt .fa span{color:var(--mute);overflow-wrap:anywhere}
/* the author's words: markdown rendered, tables and all */
.md{font-size:13.5px;line-height:1.55;overflow-wrap:anywhere}
.md p{margin:4px 0}.md ul,.md ol{margin:4px 0;padding-left:20px}.md li{margin:2px 0}
.md table{border-collapse:collapse;font-size:12.5px;margin:8px 0;max-width:100%}
.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}.md th{background:var(--soft);font-weight:600}
.md code{font:12px ui-monospace,Menlo,monospace;background:var(--soft);padding:1px 4px;border-radius:4px}
.md pre{background:var(--soft);padding:8px 10px;border-radius:8px;overflow-x:auto}
.md h1,.md h2,.md h3,.md h4{font-size:13px;margin:10px 0 4px}
.md img{display:none}
/* explainer pages, inline */
.frames{display:grid;gap:10px}
.frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.frame summary{cursor:pointer;padding:9px 12px;font-size:13px;font-weight:500;display:flex;gap:8px;align-items:center;list-style:none}
.frame summary::-webkit-details-marker{display:none}
.frame summary::before{content:"▸";color:var(--faint);font-size:11px}
.frame[open] summary::before{content:"▾"}
.frame summary .cap{margin-left:auto}
.frame iframe{display:block;width:100%;height:70vh;border:0;border-top:1px solid var(--line);background:#fff}
/* summary */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);color:inherit;display:block}
.kpi:hover{border-color:var(--faint);text-decoration:none}
.kpi .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.kpi .v{font-size:28px;font-weight:700;line-height:1.1;margin:6px 0 4px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px}
.kpi .v small{font-size:13px;color:var(--mute);font-weight:500}
.kpi .v.red{color:var(--red)}.kpi .v.green{color:var(--green)}
.kpi .s{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.ncard .t{font-weight:600;line-height:1.35;cursor:pointer}
.ncard .t:hover{color:var(--you)}
.ncard .opts{display:flex;gap:6px;flex-wrap:wrap}
.ncard .s{font-size:11.5px;color:var(--mute)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(124px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--soft);border-radius:12px;padding:9px;min-height:90px;border-top:3px solid var(--mute)}
.col.g{border-top-color:var(--green)}.col.a{border-top-color:var(--amber)}.col.r{border-top-color:var(--red)}.col.b{border-top-color:var(--you)}
.col h4{margin:0 0 7px;font-size:11px;font-weight:600;color:var(--mute);line-height:1.25}
.col h4 b{display:block;font-size:20px;color:var(--ink);line-height:1.1}
.blk{display:block;background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:6px 8px;margin:0 0 5px;color:var(--ink);font-size:12px;line-height:1.25;cursor:pointer}
.blk:hover{border-color:var(--faint);text-decoration:none}
.blk.High{border-left-color:var(--red)}.blk.Med{border-left-color:var(--amber)}.blk.Low{border-left-color:var(--green)}
.blk .n{font-weight:600;font-family:ui-monospace,Menlo,monospace}
.blk .d{float:right;color:var(--faint);font-size:10.5px}
.blk .sz{display:block;height:3px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.blk .sz i{display:block;height:100%;background:var(--mute)}
.blk .tt{display:block;color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inits .in{display:grid;grid-template-columns:minmax(0,1fr) 110px 70px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.inits .in:last-child{border-bottom:0}
.inits .in .t{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.inits .in .m{font-size:11.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inits .in .nn{font-weight:700;text-align:right;font-size:16px}
.inits .in .nn small{font-weight:400;color:var(--mute);font-size:11px}
.tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tl .day{background:var(--soft);border-radius:12px;padding:9px}
.tl .day h4{margin:0 0 6px;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.tl .ev{display:grid;grid-template-columns:38px minmax(0,1fr);gap:6px;font-size:12px;padding:3px 0;color:var(--ink);cursor:pointer;align-items:baseline}
.tl .ev span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .ev small{color:var(--faint);font-size:10.5px;font-feature-settings:"tnum"}
.tl .ev.m{color:var(--mute)}
.said{display:grid;grid-template-columns:auto 70px minmax(0,1fr);gap:6px 10px;font-size:13px;align-items:start}
.said .q{overflow-wrap:anywhere}.said .q small{display:block;color:var(--mute)}
.said .d{color:var(--faint);font-size:11.5px;white-space:nowrap;padding-top:3px}
.map{height:14px;border-radius:7px;overflow:hidden;display:flex;background:var(--soft)}
.map i{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--mute)}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.reach{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:12px}
.reach div{border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center;font-size:11.5px;color:var(--faint);background:var(--card)}
.reach div b{display:block;font-size:13px;color:inherit}
.reach div.on{color:var(--ink);background:var(--soft);border-color:var(--ink)}
.reach div.on.red{color:var(--red);border-color:var(--red)}
.vis{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px}
.files details{margin:4px 0;font-size:12.5px}
.files summary{cursor:pointer;color:var(--ink);font-weight:500}
.files summary i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
.files div{font:12px ui-monospace,Menlo,monospace;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:18px}
.files div small{color:var(--faint)}

80`, 16:9 only):\n1. x264 + angle-egl\n2. x264 + swangle/headless-shell\n3. NVENC + angle-egl\n4. x264 at CRF 12 as a near-lossless reference for the quality check\n\nFor each one: wall clock, `render.draw_timing` from worker logs, then `ffmpeg -lavfi \"[0][1]ssim;[0][1]psnr\"` for arms 1 and 3 against arm 4, plus file size.\n\n`npm run check` passes: 423 files, 4574 tests.\n\nSession: claude --resume 1ff6b069-20e5-4e0f-b809-f323aaf41d88 (cc step4)"},"explainers":[],"card":"https://firstclasstree.github.io/proofs/pr-cards/engine-384.html","initiative":"","gate":null,"triage":{"repo":"engine","number":384,"sha":"cdc858608f179f880f776f8525a4c36adad3eb0e","at":"2026-10-12T05:49:36.048Z","by":"opus reviewer (panel.mjs review)","what":"Fleet video renders can opt into the L4 GPU's hardware encoder (NVENC) with RENDER_ENCODER=nvenc, and every render now logs per-draw timing (fps, encode tail) as render.draw_timing.","why":"A 3-minute 1080p render spends about 10 minutes per aspect on the worker while the L4's encoder sits idle.","why_add":"Puts both render paths (chunk and single-pass) behind one encode function and adds the timing log that shows whether a render is limited by drawing or by encoding. It is the first step toward cutting render time and fleet cost, but the speedup is unmeasured (0 numbers so far).","why_not":"The default stays x264, so nothing changes until someone sets the flag. The refactor still touches every video render call, and the NVENC quality setting (cq 22) is a guess that has not been checked against x264. The branch conflicts with master and is 18 days old. Someone also has to run the 4-arm fleet measurement, which needs your call because it would repoint the product worker pool.","to_ship":["author: rebase onto master (currently CONFLICTING)","gate: npm run check green after rebase (no CI checks attached now)","Tal: approve a measurement path that does not repoint the product pool shapeless-worker","author: run the 4-arm measurement (x264 vs N // group header opens the board itself (Tal, 2026-10-12: "team can be one click instead of two") and
// lists only the workers that need a look.
const tone = (c) => `var(--${c === 'g' ? 'green' : c === 'a' ? 'amber' : c === 'r' ? 'red' : 'faint'})`;
const needsLook = (w) => ['failed', 'blocked', 'running'].includes(w.state);
const GROUPS = [
  { id: 'decide', title: 'Decide', kinds: ['decision', 'ask'], filter: (it) => it.kind === 'decision' || it.type === 'choice', mini: (rs) => rs.some((r) => r.byDate) ? `<b><i class="dot red"></i>${rs.filter((r) => r.byDate).length} dated</b>` : '' },
  { id: 'asks', title: 'Asks', kinds: ['ask'], filter: (it) => it.type !== 'choice', mini: (rs) => `${rs.filter((r) => r.type === 'draft').length} drafts` },
  { id: 'prs', title: 'Pull requests', kinds: ['pr'], by: (it) => it.triage?.recommend || 'unreviewed', order: Object.keys(REC), label: (k) => REC[k], mini: (rs) => ['g', 'a', 'r'].map((c) => { const n = rs.filter((r) => (REC[r.triage?.recommend || 'unreviewed'] || [])[1] === c).length; return n ? `<b><i class="dot" style="background:${tone(c)}"></i>${n}</b>` : ''; }).join('') },
  { id: 'inits', title: 'Initiatives', kinds: ['initiative'], mini: (rs) => ['red', 'amber', 'green'].map((h) => { const n = rs.filter((r) => r.health === h).length; return n ? `<b><i class="dot ${h}"></i>${n}</b>` : ''; }).join('') },
  { id: 'team', title: 'Team', go: 'team', kinds: ['group', 'worker'], filter: (it) => it.kind === 'group' || needsLook(it) || filter !== 'all', count: () => workers.length, mini: () => { const f = workers.filter((w) => w.state === 'failed').length, b = workers.filter((w) => w.state === 'blocked').length, r = workers.filter((w) => w.ranToday).length; return `${f ? `<b><i class="dot red"></i>${f}</b>` : ''}${b ? `<b><i class="dot amber"></i>${b}</b>` : ''}<b><i class="dot green"></i>${r}</b>`; } },
  { id: 'sheets', title: 'Ledgers', kinds: ['sheet'], mini: (rs) => `${rs.reduce((a, s) => a + s.counts.blocked, 0)} blocked` },
  { id: 'log', title: 'Went live', kinds: ['event'], mini: () => 'last 3 days' },

let filter = 'all', sel = null, open = new Set();
try { open = new Set(JSON.parse(localStorage.getItem('panel-open') || '[]')); } catch {}
const visible = () => items.filter((it) => filter === 'all' || (filter === 'new' && isNew(it)) || (filter === 'me' && it.needsYou));
const scoreTxt = (s) => s ? `${s.done}/${s.total}` : '';

  const badge = { summary: () => `<span class="pill">${decs.length + asks.length} for you</span>`, pr: () => `<span class="pill solid ${CRIT[it.critical] || 'grey'}">${esc(it.critical || '?')}</span>`, decision: () => `<span class="pill red">${esc(it.byDate ? 'by ' + fmtD(it.byDate) : 'open')}</span>`, ask: () => `<span class="pill ${it.type === 'choice' ? 'red' : it.type === 'retry' ? 'amber' : ''}">${esc(it.byDate ? 'by ' + fmtD(it.byDate) : it.type)}</span>`, initiative: () => `<span class="pill ${it.health}">${esc(it.num)}/${esc(it.target)}</span>`, group: () => `<span class="pill">${it.workers.length}</span>`, worker: () => `<span class="pill ${WTONE[it.state]}">${esc(it.score && it.state === 'ran' ? scoreTxt(it.score) : it.stateLabel)}</span>`, sheet: () => `<span class="pill">${it.total}</span>`, event: () => `<span class="pill">${esc(it.when)}</span>` }[it.kind]();
  const sub = { summary: () => `${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}`, pr: () => `${esc(it.repoShort)}#${it.number} · opened ${fmtD(it.created)} · pushed ${rel(it.updated)} · +${it.additions}/−${it.deletions}`, decision: () => `opened ${fmtD(it.created)} · ${esc(it.tier || '')}`, initiative: () => esc(it.measure), group: () => { const ws = workers.filter((w) => it.workers.includes(w.id)); const r = ws.filter((w) => w.ranToday).length; return `${r ? `${r} ran today` : `last ran ${fmtD(it.updated)}`} · ${ws.filter((w) => w.state === 'blocked').length} waiting`; }, worker: () => `${it.updated ? fmtDT(it.updated) + ' · ' : ''}${esc(it.blocker || (it.ranToday ? it.headline : it.job)).slice(0, 120)}`, sheet: () => `${it.counts.live} live · ${it.counts.waiting} waiting · ${it.counts.blocked} blocked · ${it.counts.todo} to do`, ask: () => `${esc(it.who)} · opened ${fmtD(it.created)}` }[it.kind]?.() ?? esc(it.sub || '');

}
function renderRail() {
  const v = visible();

// ---------- visuals ----------

// ---------- screens ----------
const ACTS = { 'merge and deploy': ['Merge and deploy', 'go'], 'merge, deploy later with others': ['Merge, deploy in the next batch', 'go'], 'needs your eyes': ['Open the diff', 'go'], 'send back': ['Send back with a note', 'danger'], split: ['Ask for a split', 'danger'], close: ['Close it', 'danger'], unreviewed: ['Open on GitHub', ''] };

function prHTML(it) {

function decisionHTML(it) {

  const closedToday = (it.closed || []).filter((c) => c.at.slice(0, 10) === new Date().toISOString().slice(0, 10));
  return `<h1>${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</h1>
  ${D.errors?.length ? `<div class="err">could not read: ${esc(D.errors.join(' · '))}</div>` : ''}
  ${D.unreviewed.length ? `<p class="pill red" style="margin:0 0 12px">${D.unreviewed.length} PRs not reviewed at their current commit: ${esc(D.unreviewed.join(', '))}</p>` : ''}
  <div class="kpis">
    ${kpi('Revenue · Polar MRR', rev.blind ? '?' : `${usd(rev.mrr)} <small>/ mo</small>`, rev.blind ? esc(rev.blind) : `${rev.paying} paying · ${rev.orders} orders ever${rev.lastOrder ? ` · last ${esc(rev.lastOrder.at)}` : ''} · read ${rel(rev.updated)}`, rev.blind ? 'red' : rev.mrr > 0 ? 'green' : '', '', rev.proof || 'https://polar.sh/dashboard')}
    ${auth ? kpi('Authority · Ahrefs DR', `${esc(auth.num)} <small>/ ${esc(auth.target)}</small>`, `${auth.trend}${auth.readAt ? ` · read ${fmtD(auth.readAt)}` : ''}`, auth.health === 'red' ? 'red' : '', auth.id) : ''}
    ${kpi('For you', now.length + deploy.length, `${decs.length + asks.filter((a) => a.type === 'choice').length} to decide · ${asks.filter((a) => a.type !== 'choice').length} to send · ${deploy.length} PRs to deploy${closedToday.length ? ` · ${closedToday.length} closed today` : ''}`, now.length > 6 ? 'red' : '', now[0]?.id || 'summary')}
    ${kpi('Team today', `${ran.length} <small>/ ${workers.filter((w) => !w.paused).length}</small>`, `${failed.length} failed · ${blocked.length} waiting · ${workers.filter((w) => w.paused).length} off`, failed.length ? 'red' : '', failed[0]?.id || blocked[0]?.id || 'team')}
  </div>
  <div class="card"><h3>For you · ${now.length} · dated ones first · the default is what happens if you say nothing${now.length > 6 ? ` · the first 6 here, the rest in the rail` : ''}</h3><div class="now">${now.slice(0, 6).map((d) => `<div class="ncard"><div class="t" data-go="${d.id}"><span class="dot ${owner(d)}"></span> ${esc(d.title)}</div><div class="opts">${d.kind === 'decision' ? optsHTML(d, false) : askBtns(d, false)}</div><div class="s">opened ${fmtD(d.created)}${d.byDate ? ` · <span style="color:var(--red)">by ${fmtD(d.byDate)}</span>` : ''}${d.default ? ` · default: ${esc(d.default)}` : d.who ? ` · ${esc(d.who)}` : ''}</div></div>`).join('') || '<span class="pill green">nothing waits on you</span>'}</div></div>
  <div class="card"><h3>${prs.length} open PRs, by what to do with them · ${deploy.length ? `the ${deploy.length} green ones are one deploy` : 'none ready to deploy'} · ${prSortSel()}</h3>${boardHTML()}</div>
  <div class="vis"><div class="card"><h3>Initiatives, the why with its number</h3><div class="inits">${inis.map((i) => `<div class="in" data-go="${i.id}"><div><div class="t"><span class="dot ${i.health}"></span> ${esc(i.title)}</div><div class="m">${esc(i.trend)}${i.blind ? ' · <span style="color:var(--red)">blind</span>' : ''} · ${fmtD(i.readAt || i.updated)}</div></div>${spark(i.series, 110, 26, `var(--${i.health === 'red' ? 'red' : i.health === 'amber' ? 'amber' : 'cos'})`)}<div class="nn">${esc(i.num)}<small> / ${esc(i.target)}</small></div></div>`).join('')}</div></div>
  <div class="card"><h3>Went live, last 3 days · ${evs.length} merges</h3><div class="tl">${days.map(([name, iso]) => { const es = evs.filter((e) => (e.updated || '').startsWith(iso)); return `<div class="day"><h4>${name} · ${es.length}</h4>${es.slice(0, 8).map((e) => `<span class="ev ${e.tier === 'silent' ? 'm' : ''}" data-go="${e.id}" title="${esc(e.title)} · ${fmtDT(e.updated)}"><small>${new Date(e.updated).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}</small><span>${esc(e.title.replace(/^(site|engine|master)#\d+ /, ''))}</span></span>`).join('')}${es.length > 8 ? `<span class="ev m"><small></small><span>${es.length - 8} more in the rail</span></span>` : ''}</div>`; }).join('')}</div></div></div>
  <div class="card"><h3>Team · ${ran.length} ran · ${failed.length} failed · ${blocked.length} waiting · <a href="#" data-go="team">the board</a> · a team name opens the team</h3>${teamStrip()}</div>
  <div class="card"><h3>Ledgers</h3><div class="inits">${sheets.map((s) => `<div class="in" data-go="${s.id}"><div><div class="t">${esc(s.title)}</div><div class="m">${s.counts.live} live · ${s.counts.waiting} waiting · ${s.counts.blocked} blocked · ${s.counts.todo} to do${s.updated ? ` · last ${esc(s.updated.slice(0, 10))}` : ''}</div></div><div class="seg" style="margin:0;width:110px">${['live', 'waiting', 'blocked', 'todo', 'off'].map((k) => `<b class="${k}" style="width:${(s.counts[k] / (s.total || 1)) * 100}%"></b>`).join('')}</div><div class="nn">${s.total}</div></div>`).join('')}</div></div>
  <details class="card"><summary style="cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600">Decided and closed · ${(it.closed || []).length}</summary><ul class="hist" style="margin-top:10px">${(it.closed || []).map((c) => `<li><span>${fmtDT(c.at)}</span><b>${esc(c.title)}${c.what && c.what !== 'done' ? ` <span style="color:var(--mute);font-weight:400">· ${esc(c.what)}</span>` : ''}</b></li>`).join('') || '<li><span></span><b>nothing yet</b></li>'}</ul></details>
  <details class="card"><summary style="cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600">What you told me, and where it stands · ${it.said.length}</summary><div class="said" style="margin-top:10px">${[...it.said].reverse().map((s) => `<span class="pill ${STATE[s.state] || 'grey'}">${esc(s.state)}</span><span class="d">${fmtD(s.on)}</span><div class="q">${esc(s.quote)}<small>${esc(s.stands)}</small></div>`).join('')}</div></details>`;
}
// Buttons that act: POST to home, which runs status.mjs act <id> (n = the button, value = text).
async function act(id, n = 0, value = '') {
  const r = await fetch(`/fix/${encodeURIComponent(id)}`, { method: 'POST', headers: { 'x-home': '1', 'content-type': 'application/json' }, body: JSON.stringify({ n, value }) });
  let j = {}; try { j = await r.json(); } catch {}
  return j;
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act],[data-fix]'); if (!b) return;
  e.preventDefault();
  let id, n = 0, value = '';
  if (b.dataset.act) { id = b.dataset.act; value = /^(panel-note-|tell-)/.test(id) ? b.closest('.talk')?.querySelector('[data-tell]')?.value?.trim() : b.dataset.value || ''; if (/^(panel-note-|tell-)/.test(id) && !value) return; }
  else { id = b.dataset.fix; n = Number(b.dataset.n); if (b.dataset.from) { value = document.querySelector(`[data-input="${b.dataset.from}"]`)?.value?.trim() || ''; if (!value) return; } }
  const was = b.textContent; b.textContent = '…';
  const j = await act(id, n, value);
  b.textContent = j.ok ? 'done' : (j.message || j.error || 'failed');
  if (j.ok && /^(panel-note-|tell-)/.test(id)) { const i = b.closest('.talk')?.querySelector('[data-tell]'); if (i) i.value = ''; setTimeout(() => (b.textContent = was), 1500); }
  else if (j.ok) setTimeout(() => location.reload(), 700);
  else setTimeout(() => (b.textContent = was), 2500);
});
// Talk: home opens a Terminal window on the session. If home refuses, the command is copied instead.
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-term]'); if (!b) return;
  e.preventDefault();
  const r = await fetch('/open', { method: 'POST', headers: { 'x-home': '1', 'content-type': 'application/json' }, body: JSON.stringify({ command: b.dataset.term }) }).catch(() => null);
  if (r?.ok) { b.classList.add('ok'); const was = b.innerHTML; b.innerHTML = b.classList.contains('ib') ? '✓' : 'opened in Terminal'; setTimeout(() => { b.innerHTML = was; b.classList.remove('ok'); }, 1800); }
  else { navigator.clipboard?.writeText(b.dataset.term); const was = b.innerHTML; b.innerHTML = b.classList.contains('ib') ? '⧉' : 'copied, paste it in a terminal'; setTimeout(() => (b.innerHTML = was), 1800); }
});
const R = { pr: prHTML, decision: decisionHTML, ask: askHTML, initiative: initiativeHTML, worker: workerHTML, team: teamHTML, group: groupHTML, sheet: sheetHTML, event: eventHTML, summary: summaryHTML };
// Every screen is a history entry, so the browser's back button returns to the one before it
// (Tal, 2026-10-12: "going backwards in page doesn't return to the previous page").
function show(id, { push = true } = {}) {
  const it = items.find((x) => x.id === id); if (!it) return;
  sel = id; document.getElementById('pane').innerHTML = R[it.kind](it); document.getElementById('pane').scrollTop = 0;
  if (!D.standalone) { renderRail(); document.querySelector('.row.sel')?.scrollIntoView({ block: 'nearest' }); if (push && location.hash !== `#${id}`) history.pushState({ id }, '', `#${id}`); else if (!push) history.replaceState({ id }, '', `#${id}`); }
  try { localStorage.setItem('panel-sel', id); } catch {}
}
window.show = show;
window.addEventListener('popstate', (e) => { const id = e.state?.id || location.hash.slice(1); if (id && id !== sel) show(id, { push: false }); });
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-act],[data-fix],[data-term]')) return;
  const c = e.target.closest('[data-copy]'); if (c) { navigator.clipboard?.writeText(c.dataset.copy); c.classList.add('ok'); setTimeout(() => c.classList.remove('ok'), 900); return; }
  const r = e.target.closest('.row'); if (r) return show(r.dataset.id);
  const f = e.target.closest('[data-f]'); if (f) { filter = f.dataset.f; return renderRail(); }
  if (e.target.closest('select')) return;
  const g = e.target.closest('.group h2'); if (g) { const el = g.parentElement; const id = el.dataset.g; const go = el.dataset.gogo; if (go && sel !== go) { open.add(id); try { localStorage.setItem('panel-open', JSON.stringify([...open])); } catch {} return show(go); } open.has(id) ? open.delete(id) : open.add(id); try { localStorage.setItem('panel-open', JSON.stringify([...open])); } catch {} return renderRail(); }
  const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); return show(go.dataset.go); }
  const run = e.target.closest('[data-run]'); if (run) { const it = items.find((x) => x.id === sel); document.querySelectorAll('.run').forEach((x) => x.classList.toggle('sel', x === run)); document.getElementById('runtext').innerHTML = linkify(it.runs[Number(run.dataset.run)].text || 'no summary'); return; }
  const ts = e.target.closest('[data-teamsort]'); if (ts) { teamSort = ts.dataset.teamsort; try { localStorage.setItem('panel-teamsort', teamSort); } catch {} return show(sel, { push: false }); }
  const th = e.target.closest('table.sheet th[data-col]'); if (th) { const c = th.dataset.col; sheetSort = { col: c, dir: sheetSort.col === c ? -sheetSort.dir : 1 }; show(sel, { push: false }); return; }
  const sf = e.target.closest('[data-sf]'); if (sf) { const s = sf.dataset.sf; document.querySelectorAll('table.sheet tbody tr').forEach((tr) => tr.classList.toggle('hide', s !== 'all' && tr.dataset.state !== s)); return; }
  const cl = e.target.closest('.clamp'); if (cl && !e.target.closest('a')) cl.classList.toggle('open');
});
document.addEventListener('change', (e) => { const p = e.target.closest('[data-prsort]'); if (!p) return; prSort = p.value; try { localStorage.setItem('panel-prsort', prSort); } catch {} show(sel, { push: false }); });
document.addEventListener('input', (e) => { const q = e.target.closest('[data-sq]'); if (!q) return; const s = q.value.toLowerCase(); document.querySelectorAll('table.sheet tbody tr').forEach((tr) => tr.classList.toggle('hide', !!s && !tr.textContent.toLowerCase().includes(s))); });
document.addEventListener('keydown', (e) => {
  if (['TEXTAREA', 'INPUT'].includes(e.target.tagName)) return;
  const v = visible(); const i = v.findIndex((x) => x.id === sel);
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); show(v[Math.min(v.length - 1, i + 1)]?.id); }
  if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); show(v[Math.max(0, i - 1)]?.id); }
  if (e.key === 'Enter' || e.key === '1') { const a = document.querySelector('.pane .card a.btn, .pane .opt a.btn'); if (a) window.open(a.href, '_blank'); }
});
// ---------- top bar ----------
document.getElementById('meta').innerHTML = `built ${esc(D.builtAt)} · <b>${items.filter(isNew).length} moved</b> since you looked ${esc(since.toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' }))}`;
document.getElementById('people').innerHTML = (D.people || []).map((p) => `<div class="person ${/live/.test(p.state) ? 'live' : ''}" title="${esc(p.what)}&#10;${esc(p.cmd)}"><span class="dot ${p.dot}"></span><span><div class="nm">${esc(p.name)}</div><div class="st">${esc(p.state)}</div></span>${talkBtn(p.cmd, '', 'ib')}${p.cmd ? `<button class="ib" data-copy="${esc(p.cmd)}" title="copy ${esc(p.cmd)}">⧉</button>` : ''}</div>`).join('');
if (!D.standalone) renderRail();
let first = location.hash.slice(1) || D.select || null; if (!first) { try { first = localStorage.getItem('panel-sel'); } catch {} }
show(items.find((x) => x.id === first)?.id || items[0]?.id, { push: false });
</script>
