<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shapeless Employees</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--rail:#fff;--card:#fff;--ink:#101828;--mute:#667085;--faint:#98a2b3;--line:#e4e7ec;--soft:#f2f4f7;--top:#121a2d;--topink:#e8ecf5;--topmute:#8f9bb8;--you:#2f5bea;--pa:#7c3aed;--cos:#0e9f6e;--red:#d92d20;--amber:#dc6803;--green:#079455;--new:#fef0c7;--sel:#eef2ff;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
 --a-pages:#2f5bea;--a-studio:#6938ef;--a-extension:#9e77ed;--a-API:#0e9aa7;--a-CLI:#0b7285;--a-money:#d92d20;--a-data:#e04f16;--a-server:#17b26a;--a-engine:#079455;--a-prompts:#dd2590;--a-tooling:#667085;--a-config:#98a2b3;--a-docs:#d0d5dd;--a-tests:#a6ef67;--a-other:#e4e7ec}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0e14;--rail:#10141c;--card:#141922;--ink:#eaecf0;--mute:#98a2b3;--faint:#667085;--line:#232a36;--soft:#1b212c;--top:#0a0d14;--new:#3d2f0a;--sel:#1a2340;--shadow:none}}
:root[data-theme="dark"]{--bg:#0b0e14;--rail:#10141c;--card:#141922;--ink:#eaecf0;--mute:#98a2b3;--faint:#667085;--line:#232a36;--soft:#1b212c;--top:#0a0d14;--new:#3d2f0a;--sel:#1a2340;--shadow:none}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"tnum","cv11";display:flex;flex-direction:column;overflow-x:hidden}
a{color:var(--you);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.01em}
/* top bar */
.top{display:flex;align-items:center;gap:8px 18px;padding:0 20px;min-height:54px;background:var(--top);color:var(--topink);flex-wrap:wrap}
.top .brand{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.top .brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#2f5bea,#7c3aed);display:inline-block}
.top .brand small{font-weight:500;color:var(--topmute)}
.top .meta{color:var(--topmute);font-size:12px}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:100%;padding:8px 0}
.person{display:flex;align-items:center;gap:9px;border-radius:10px;padding:5px 8px 5px 10px;background:rgba(255,255,255,.06);max-width:100%}
.person .nm{font-weight:600;font-size:12.5px;white-space:nowrap;color:var(--topink)}
.person .st{font-size:11px;color:var(--topmute);white-space:nowrap}
.person.live .st{color:#4ade80}
.person .copy{background:rgba(255,255,255,.08);border-color:transparent;color:var(--topink)}
.whoBtn{border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--topink);border-radius:999px;padding:5px 11px;font-size:12px}
.since{font-size:12px;color:#fcd34d;white-space:nowrap}
/* shared atoms */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;line-height:1;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--mute);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.red{background:#fee4e2;color:#b42318}.pill.amber{background:#fef0c7;color:#b54708}.pill.green{background:#dcfae6;color:#067647}.pill.blue{background:#e0eaff;color:#2f5bea}.pill.new{background:var(--new);color:#93370d}
.pill.solid.red{background:var(--red);color:#fff}.pill.solid.amber{background:var(--amber);color:#fff}.pill.solid.green{background:var(--green);color:#fff}.pill.solid.grey{background:var(--mute);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.red{background:#3b1210;color:#fda29b}:root:not([data-theme="light"]) .pill.amber{background:#3d2608;color:#fdb022}:root:not([data-theme="light"]) .pill.green{background:#0b2e1e;color:#75e0a7}:root:not([data-theme="light"]) .pill.blue{background:#172554;color:#a4bcfd}}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.pa{background:var(--pa)}.dot.cos{background:var(--cos)}.dot.you{background:var(--you)}.dot.red{background:var(--red)}.dot.amber{background:var(--amber)}.dot.green{background:var(--green)}.dot.grey{background:var(--faint)}.dot.blue{background:var(--you)}
.copy{border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:3px 9px;font:12px ui-monospace,Menlo,monospace;color:var(--ink);display:inline-flex;gap:7px;align-items:center;max-width:100%}
.copy span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy:hover{border-color:var(--you)}
.copy.ok{border-color:var(--green);color:var(--green)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:500;display:inline-flex;gap:7px;align-items:center;white-space:nowrap;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--faint);text-decoration:none}
.btn.go{background:var(--you);color:#fff;border-color:var(--you)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn kbd{font:11px ui-monospace,Menlo,monospace;background:rgba(127,127,127,.2);border-radius:4px;padding:1px 5px}
/* layout */
.wrap{display:flex;flex:1;min-height:0}
.rail{width:336px;flex:none;border-right:1px solid var(--line);background:var(--rail);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.chips{display:flex;gap:6px;padding:12px 14px 6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:500}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group{padding:6px 0 2px}
.group h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0;padding:10px 16px 4px;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-weight:600}
.group h2 .n{color:var(--ink);font-weight:700;background:var(--soft);border-radius:6px;padding:1px 6px}
.group h2 .sub{text-transform:none;letter-spacing:0;font-weight:400;margin-left:auto;font-size:11px;white-space:nowrap}
.group h2::before{content:"▾";color:var(--faint);font-size:10px}
.group.closed h2::before{content:"▸"}
.group.closed .rows{display:none}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 16px 8px 14px;cursor:pointer;border-left:3px solid transparent}
.row:hover{background:var(--soft)}
.row.sel{background:var(--sel);border-left-color:var(--you)}
.row .t{font-size:13.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .s{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .b{display:flex;gap:4px;align-items:center;flex:none}
.row.new .t::before{content:"new";font-size:10px;background:var(--new);color:#93370d;padding:1px 5px;border-radius:4px;margin-right:6px;vertical-align:1px;font-weight:600}
.sub-h{font-size:11px;color:var(--faint);padding:8px 16px 2px;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center;font-weight:600}
.sub-h i{width:8px;height:8px;border-radius:2px;display:inline-block}
.pane{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 30px 80px;min-width:0}
.pane h1{font-size:21px;margin:0 0 8px;line-height:1.3;overflow-wrap:anywhere}
.hdr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.sec{margin:0 0 18px;padding:0 0 16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3,.card h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:600}
.sec p{margin:4px 0;overflow-wrap:anywhere}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow)}
.card .rec{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card .why{color:var(--mute);font-size:13px;margin-top:10px}
.card .alts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0;overflow-wrap:anywhere}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:8px}
.shots a{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);aspect-ratio:4/3}
.shots img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.gaps li{color:var(--red)}
.spark{vertical-align:middle;flex:none}
.num{font-size:32px;font-weight:700;line-height:1;letter-spacing:-.02em}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:10px 0;display:flex}
.bar b{display:block;height:100%;background:var(--cos)}.bar b.red{background:var(--red)}.bar b.amber{background:var(--amber)}
.hist{list-style:none;padding:0;margin:0;font-size:13px}
.hist li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:4px 0;color:var(--mute)}
.hist li b{color:var(--ink);font-weight:500;overflow-wrap:anywhere}
textarea,input.in{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;background:var(--card);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
textarea:focus,input.in:focus{outline:0;border-color:var(--you)}
.legend{position:fixed;right:16px;bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12px;color:var(--mute);max-width:min(440px,calc(100vw - 32px));max-height:70vh;overflow:auto;box-shadow:0 8px 30px rgba(16,24,40,.14)}
.legend b{color:var(--ink)}
.legend .who{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;margin-top:8px}
.legend.hide{display:none}
.empty{color:var(--mute);padding:40px;text-align:center}
.err{background:#fee4e2;color:#b42318;border-radius:10px;padding:8px 12px;font-size:12.5px;margin:0 0 12px}
/* visuals */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--faint)}
.kpi .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.kpi .v{font-size:28px;font-weight:700;line-height:1.1;margin:6px 0 4px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px}
.kpi .v small{font-size:13px;color:var(--mute);font-weight:500}
.kpi .v.red{color:var(--red)}.kpi .v.green{color:var(--green)}
.kpi .s{font-size:12px;color:var(--mute)}
.now{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.ncard .t{font-weight:600;line-height:1.35;cursor:pointer}
.ncard .t:hover{color:var(--you)}
.ncard .opts{display:flex;gap:6px;flex-wrap:wrap}
.ncard .s{font-size:11.5px;color:var(--mute)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(124px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--soft);border-radius:12px;padding:9px;min-height:90px;border-top:3px solid var(--mute)}
.col.g{border-top-color:var(--green)}.col.a{border-top-color:var(--amber)}.col.r{border-top-color:var(--red)}.col.b{border-top-color:var(--you)}
.col h4{margin:0 0 7px;font-size:11px;font-weight:600;color:var(--mute);line-height:1.25}
.col h4 b{display:block;font-size:20px;color:var(--ink);line-height:1.1}
.blk{display:block;background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:6px 8px;margin:0 0 5px;color:var(--ink);font-size:12px;line-height:1.25;cursor:pointer}
.blk:hover{border-color:var(--faint);text-decoration:none}
.blk.High{border-left-color:var(--red)}.blk.Med{border-left-color:var(--amber)}.blk.Low{border-left-color:var(--green)}
.blk .n{font-weight:600;font-family:ui-monospace,Menlo,monospace}
.blk .sz{display:block;height:3px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.blk .sz i{display:block;height:100%;background:var(--mute)}
.blk .tt{display:block;color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inits .in{display:grid;grid-template-columns:minmax(0,1fr) 110px 70px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.inits .in:last-child{border-bottom:0}
.inits .in .t{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.inits .in .m{font-size:11.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inits .in .nn{font-weight:700;text-align:right;font-size:16px}
.inits .in .nn small{font-weight:400;color:var(--mute);font-size:11px}
.tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tl .day{background:var(--soft);border-radius:12px;padding:9px}
.tl .day h4{margin:0 0 6px;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.tl .ev{display:block;font-size:12px;padding:3px 0;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tl .ev::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px}
.tl .ev.m::before{background:var(--faint)}
.said{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;font-size:13px}
.said .q{overflow-wrap:anywhere}.said .q small{display:block;color:var(--mute)}
.map{height:14px;border-radius:7px;overflow:hidden;display:flex;background:var(--soft)}
.map i{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--mute)}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.reach{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:12px}
.reach div{border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center;font-size:11.5px;color:var(--faint);background:var(--card)}
.reach div b{display:block;font-size:13px;color:inherit}
.reach div.on{color:var(--ink);background:var(--soft);border-color:var(--ink)}
.reach div.on.red{color:var(--red);border-color:var(--red)}
.vis{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px}
.files details{margin:4px 0;font-size:12.5px}
.files summary{cursor:pointer;color:var(--ink);font-weight:500}
.files summary i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
.files div{font:12px ui-monospace,Menlo,monospace;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:18px}
.files div small{color:var(--faint)}
/* workers and sheets */
.week{display:inline-flex;gap:3px;align-items:flex-end}
.week i{display:block;width:10px;height:10px;border-radius:3px;background:var(--line)}
.week i.ok{background:var(--green)}.week i.failed{background:var(--red)}.week i.today{outline:2px solid var(--you);outline-offset:1px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.45}
.list li b{font:700 13px ui-monospace,Menlo,monospace;color:var(--green)}
.list li.no b{color:var(--red)}.list li.ask b{color:var(--amber)}
.list li span{overflow-wrap:anywhere}
.blocker{background:#fef0c7;color:#93370d;border-radius:10px;padding:10px 12px;font-size:13px}
.blocker.red{background:#fee4e2;color:#b42318}
.blocker small{display:block;margin-top:4px;opacity:.8}
.seg{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft);margin:8px 0 10px}
.seg b{display:block;height:100%;cursor:pointer}
.seg .live{background:var(--green)}.seg .waiting{background:var(--amber)}.seg .blocked{background:var(--red)}.seg .todo{background:var(--you)}.seg .off{background:var(--faint)}
.st{font-size:11px;font-weight:600;padding:3px 7px;border-radius:999px;white-space:nowrap}
.st.live{background:#dcfae6;color:#067647}.st.waiting{background:#fef0c7;color:#b54708}.st.blocked{background:#fee4e2;color:#b42318}.st.todo{background:#e0eaff;color:#2f5bea}.st.off{background:var(--soft);color:var(--mute)}
table.sheet{width:100%;border-collapse:collapse;font-size:12.5px}
table.sheet th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
table.sheet td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
table.sheet td.n{font-weight:500;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
table.sheet td.w{color:var(--mute);max-width:520px}
table.sheet tr.hide{display:none}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.tools input{flex:1;min-width:160px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;background:var(--card);color:var(--ink)}
/* standalone card */
body.standalone .top,body.standalone .rail,body.standalone .legend{display:none}
body.standalone .pane{max-width:1120px;margin:0 auto;padding:28px 28px 80px}
.cardhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:12.5px;margin:0 0 14px}
.cardhead b{color:var(--ink)}
@media (max-width:860px){.wrap{flex-direction:column}.rail{width:100%;max-height:42vh;border-right:0;border-bottom:1px solid var(--line)}.pane{padding:16px}.legend{display:none}.vis{grid-template-columns:1fr}.reach{grid-template-columns:repeat(3,minmax(0,1fr))}.top .right{margin-left:0}.person{padding:4px 8px}.person .st{display:none}.tl{grid-template-columns:1fr}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
<div class="brand"><i></i>Shapeless <small>Employees</small></div>
<span class="meta" id="built"></span>
<span class="since" id="since"></span>
<div class="right" id="people"></div>
</div>
<div class="wrap">
<nav class="rail" id="rail"></nav>
<main class="pane" id="pane"><div class="empty">Pick an item. j / k move, 1 2 3 act, Enter opens the real thing.</div></main>

    ${kpi('For you', now.length, `${decs.length + asks.filter((a) => a.type === 'choice').length} to decide · ${asks.filter((a) => a.type !== 'choice').length} to send or clear`, now.length > 6 ? 'red' : '', now[0]?.id || 'summary')}
    ${kpi('PRs open', prs.length, `${deploy.length} deploy now · ${byRec('needs your eyes').length} your eyes · ${byRec('split').length} split`, '', prs[0]?.id || 'summary')}
    ${kpi('Team today', `${ran.length} <small>/ ${workers.filter((w) => !w.paused).length}</small>`, `${failed.length} failed · ${blocked.length} waiting · ${workers.filter((w) => w.paused).length} off`, failed.length ? 'red' : '', failed[0]?.id || blocked[0]?.id || 'w-chief')}
  </div>
  <div class="card"><h3>For you · ${now.length} · one click each, the default is what happens if you say nothing${now.length > 6 ? ` · the first 6 here, the rest in the rail` : ''}</h3><div class="now">${now.slice(0, 6).map((d) => `<div class="ncard"><div class="t" data-go="${d.id}"><span class="dot ${owner(d)}"></span> ${esc(d.title)}</div><div class="opts">${d.kind === 'decision' ? optsHTML(d, false) : askBtns(d, false)}</div><div class="s">${esc(d.by ? 'by ' + d.by + ' · ' : '')}${esc(d.default ? 'default: ' + d.default : d.who || '')}</div></div>`).join('') || '<span class="pill green">nothing waits on you</span>'}</div></div>
  <div class="card"><h3>${prs.length} open PRs, by what to do with them · ${deploy.length ? `the ${deploy.length} green ones are one deploy` : 'none ready to deploy'}</h3>${boardHTML()}</div>
  <div class="vis"><div class="card"><h3>Initiatives, the why with its number</h3><div class="inits">${inis.map((i) => `<div class="in" data-go="${i.id}"><div><div class="t"><span class="dot ${i.health}"></span> ${esc(i.title)}</div><div class="m">${esc(i.trend)}${i.blind ? ' · <span style="color:var(--red)">blind</span>' : ''}</div></div>${spark(i.series, 110, 26, `var(--${i.health === 'red' ? 'red' : i.health === 'amber' ? 'amber' : 'cos'})`)}<div class="nn">${esc(i.num)}<small> / ${esc(i.target)}</small></div></div>`).join('')}</div></div>
  <div class="card"><h3>Went live, last 3 days · ${evs.length} merges</h3><div class="tl">${days.map(([name, iso]) => { const es = evs.filter((e) => (e.updated || '').startsWith(iso)); return `<div class="day"><h4>${name} · ${es.length}</h4>${es.slice(0, 8).map((e) => `<span class="ev ${e.tier === 'silent' ? 'm' : ''}" data-go="${e.id}" title="${esc(e.title)}">${esc(e.title.replace(/^(site|engine|master)#\d+ /, ''))}</span>`).join('')}${es.length > 8 ? `<span class="ev m">${es.length - 8} more in the rail</span>` : ''}</div>`; }).join('')}</div></div></div>
  <div class="card"><h3>Team today · ${ran.length} ran · ${failed.length} failed · ${blocked.length} waiting</h3><div class="now">${[...failed, ...blocked, ...ran.filter((w) => !failed.includes(w) && !blocked.includes(w)).slice(0, 8)].map((w) => `<div class="ncard"><div class="t" data-go="${w.id}"><span class="dot ${WTONE[w.state]}"></span> ${esc(w.title)}</div><div class="s">${esc((w.blocker || w.headline || w.job).slice(0, 160))}</div></div>`).join('')}</div></div>
  <div class="card"><h3>Ledgers</h3><div class="inits">${sheets.map((s) => `<div class="in" data-go="${s.id}"><div><div class="t">${esc(s.title)}</div><div class="m">${s.counts.live} live · ${s.counts.waiting} waiting · ${s.counts.blocked} blocked · ${s.counts.todo} to do</div></div><div class="seg" style="margin:0;width:110px">${['live', 'waiting', 'blocked', 'todo', 'off'].map((k) => `<b class="${k}" style="width:${(s.counts[k] / (s.total || 1)) * 100}%"></b>`).join('')}</div><div class="nn">${s.total}</div></div>`).join('')}</div></div>
  <details class="card"><summary style="cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600">What you told me, and where it stands · ${it.said.length}</summary><div class="said" style="margin-top:10px">${[...it.said].reverse().map((s) => `<span class="pill ${STATE[s.state] || 'grey'}">${esc(s.state)}</span><div class="q">${esc(s.quote)}<small>${esc(s.on)} · ${esc(s.stands)}</small></div>`).join('')}</div></details>`;
}
// Buttons that act: POST to home, which runs status.mjs act <id> (n = the button, value = text).
async function act(id, n = 0, value = '') {
  const r = await fetch(`/fix/${encodeURIComponent(id)}`, { method: 'POST', headers: { 'x-home': '1', 'content-type': 'application/json' }, body: JSON.stringify({ n, value }) });
  let j = {}; try { j = await r.json(); } catch {}
  return j;
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act],[data-fix]'); if (!b) return;
  e.preventDefault();
  let id, n = 0, value = '';
  if (b.dataset.act) { id = b.dataset.act; value = /^(panel-note-|tell-)/.test(id) ? b.closest('.sec')?.querySelector('textarea')?.value?.trim() : b.dataset.value || ''; if (/^(panel-note-|tell-)/.test(id) && !value) return; }
  else { id = b.dataset.fix; n = Number(b.dataset.n); if (b.dataset.from) { value = document.querySelector(`[data-input="${b.dataset.from}"]`)?.value?.trim() || ''; if (!value) return; } }
  const was = b.textContent; b.textContent = '…';
  const j = await act(id, n, value);
  b.textContent = j.ok ? 'done' : (j.message || j.error || 'failed');
  if (j.ok && !/^(panel-note-|tell-)/.test(id)) setTimeout(() => location.reload(), 700);
  else if (!j.ok) setTimeout(() => (b.textContent = was), 2500);
});
const R = { pr: prHTML, decision: decisionHTML, ask: askHTML, initiative: initiativeHTML, worker: workerHTML, sheet: sheetHTML, event: eventHTML, summary: summaryHTML };
function show(id) {
  const it = items.find((x) => x.id === id); if (!it) return;
  sel = id; document.getElementById('pane').innerHTML = R[it.kind](it); document.getElementById('pane').scrollTop = 0;
  if (!D.standalone) { renderRail(); document.querySelector('.row.sel')?.scrollIntoView({ block: 'nearest' }); history.replaceState(null, '', `#${id}`); }
  try { localStorage.setItem('panel-sel', id); } catch {}
}
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-act],[data-fix]')) return;
  const c = e.target.closest('[data-copy]'); if (c) { navigator.clipboard?.writeText(c.dataset.copy); c.classList.add('ok'); setTimeout(() => c.classList.remove('ok'), 900); return; }
  const r = e.target.closest('.row'); if (r) return show(r.dataset.id);
  const f = e.target.closest('[data-f]'); if (f) { filter = f.dataset.f; return renderRail(); }
  const g = e.target.closest('.group h2'); if (g) { const id = g.parentElement.dataset.g; open.has(id) ? open.delete(id) : open.add(id); return renderRail(); }
  const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); return show(go.dataset.go); }
  const sf = e.target.closest('[data-sf]'); if (sf) { const s = sf.dataset.sf; document.querySelectorAll('table.sheet tbody tr').forEach((tr) => tr.classList.toggle('hide', s !== 'all' && tr.dataset.state !== s)); return; }
  if (e.target.id === 'whoBtn') document.getElementById('legend').classList.toggle('hide');
});
document.addEventListener('input', (e) => { const q = e.target.closest('[data-sq]'); if (!q) return; const s = q.value.toLowerCase(); document.querySelectorAll('table.sheet tbody tr').forEach((tr) => tr.classList.toggle('hide', !!s && !tr.textContent.toLowerCase().includes(s))); });
document.addEventListener('keydown', (e) => {
  if (['TEXTAREA', 'INPUT'].includes(e.target.tagName)) return;
  const v = visible(); const i = v.findIndex((x) => x.id === sel);
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); show(v[Math.min(v.length - 1, i + 1)]?.id); }
  if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); show(v[Math.max(0, i - 1)]?.id); }
  if (e.key === 'Enter' || e.key === '1') { const a = document.querySelector('.pane .card a.btn'); if (a) window.open(a.href, '_blank'); }
});
// ---------- top bar, legend ----------
document.getElementById('built').textContent = `built ${D.builtAt} · GitHub every 10 min, the run records and the ledgers live`;
document.getElementById('since').textContent = `${items.filter(isNew).length} moved since you looked, ${since.toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' })}`;
document.getElementById('people').innerHTML = (D.people || []).map((p) => `<div class="person ${/live/.test(p.state) ? 'live' : ''}" title="${esc(p.what)}"><span class="dot ${p.dot}"></span><span><div class="nm">${esc(p.name)}</div><div class="st">${esc(p.state)}</div></span>${copyBtn(p.cmd, p.cmd.replace(/([0-9a-f]{8})-[0-9a-f-]{27}/, '$1…'))}</div>`).join('') + `<button class="whoBtn" id="whoBtn">who does what</button>`;
document.getElementById('legend').innerHTML = `<b>Who does what</b> · click a name to copy it, the arrow opens it here<div class="who">${(D.who || []).filter((w) => w.status !== 'ended').map((w) => `<span class="dot ${w.team === 'assistant' ? 'pa' : 'cos'}"></span><span><b>${copyBtn(w.id, w.id)}</b> <a href="#" data-go="w-${esc(w.id)}">↗</a> ${esc(w.job)}${w.status === 'paused' ? ' <span class="pill">paused</span>' : ''}</span><span>${esc(w.days)}</span>`).join('')}</div>`;
if (!D.standalone) renderRail();
let first = location.hash.slice(1) || D.select || null; if (!first) { try { first = localStorage.getItem('panel-sel'); } catch {} }
show(items.find((x) => x.id === first)?.id || items[0]?.id);
</script>
